services:
    pgsql:
        image: postgres:18-alpine
        container_name: carrot-pgsql
        restart: unless-stopped
        environment:
            POSTGRES_DB: carrot
            POSTGRES_USER: carrot
            POSTGRES_PASSWORD: secret
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U carrot -d carrot"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    pgdata:
